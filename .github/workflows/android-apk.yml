# Compila el APK nativo de MV FBA IA en cada push que toque la app
# Android o la UI movil. Lo publica de dos formas:
#   1) como artifact (util para descargar desde la pestana Actions), y
#   2) como asset de un GitHub Release con tag "android-latest", que sirve el
#      .apk CRUDO — desde el celular abris el link del release y lo instalas
#      directo (el artifact, en cambio, se baja como .zip y el instalador de
#      APK del telefono NO detecta un zip).
#
# El APK sale firmado con v1 (JAR) + v2 + v3, asi lo reconoce cualquier
# instalador de APK y cualquier Android 7+ (ver android/build-apk.sh).
name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

# Pushes seguidos: se cancela el build del commit ya superado (ahorra cuota).
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # para crear/actualizar el Release con el .apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # El keystore de firma YA NO viaja en el repo (viajaba, con su
      # contraseña en texto plano en build.gradle, hasta que el repo paso por
      # publico y quedo expuesto a cualquiera). Ahora vive SOLO como secret de
      # GitHub, codificado en base64, y se decodifica aca a un archivo
      # temporal que nunca se commitea ni se sube como artifact.
      - name: Preparar el keystore de firma
        env:
          MVFBA_KEYSTORE_BASE64: ${{ secrets.MVFBA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${MVFBA_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Falta el secret MVFBA_KEYSTORE_BASE64. Sin el keystore no se puede firmar el APK." >&2
            exit 1
          fi
          echo "$MVFBA_KEYSTORE_BASE64" | base64 -d > android/app/mv-release.keystore

      - name: Compilar y firmar APK (v1+v2+v3)
        env:
          MVFBA_KEYSTORE_PASSWORD: ${{ secrets.MVFBA_KEYSTORE_PASSWORD }}
          MVFBA_KEY_ALIAS: ${{ secrets.MVFBA_KEY_ALIAS }}
        run: bash android/build-apk.sh

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: MV-Amazon-FBA-IA-apk
          path: android/app/build/outputs/apk/release/MV-Amazon-FBA-IA.apk
          if-no-files-found: error

      # El runner se destruye entero al terminar el job (no hay reuso entre
      # corridas), asi que esto no es indispensable -- pero borrar el
      # keystore decodificado apenas termina de usarse es la practica
      # correcta, y corre "if: always()" para no saltearse aunque el build
      # anterior haya fallado.
      - name: Borrar el keystore decodificado
        if: always()
        run: rm -f android/app/mv-release.keystore

      - name: Publicar APK en un Release (descarga directa desde el celular)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MV FBA IA — App Android
          body: |
            APK nativo y autocontenido de MV FBA IA. Corre 100% en el
            telefono, sin depender de la PC.

            **Instalar desde el celular:**
            1. Abri este link en el navegador del telefono y descarga
               `MV-Amazon-FBA-IA.apk`.
            2. Tocá el archivo descargado. Si aparece "Instalar apps desconocidas",
               habilitalo para tu navegador y volvé a tocarlo.
            3. Instalar → Abrir.

            Firmado con v1+v2+v3, compatible con Android 7.0+.
          prerelease: true
          files: android/app/build/outputs/apk/release/MV-Amazon-FBA-IA.apk
          fail_on_unmatched_files: true
