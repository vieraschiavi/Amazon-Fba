# Compila el instalador .exe de Windows (Inno Setup) en un runner Windows real
# y lo publica como artifact descargable en la pestana Actions. Se dispara con
# cada push que toque el instalador o el codigo del programa, y a mano.
name: Windows Installer (EXE)

on:
  push:
    paths:
      - "installer/**"
      - "*.py"
      - "*.bat"
      - "agents/**"
      - "core/**"
      - "data/**"
      - "requirements.txt"
      - "requirements-desktop.txt"
      - "frontend/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
    inputs:
      owner:
        description: "Build OWNER (interno, arranca pre-activado). Se publica en el Release owner-latest, NUNCA en pc-latest."
        type: boolean
        default: false
      owner_email:
        description: "Email de dueño para el build OWNER. Con esto alcanza: la clave se pide sola al servidor. Si se deja vacio, se usan los secrets OWNER_LICENSE_EMAIL/OWNER_LICENSE_KEY."
        type: string
        required: false
        default: ""

# Pushes seguidos: se cancela el build del commit ya superado (ahorra cuota).
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # para publicar el Release con el instalador

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El panel SaaS (React) se compila ANTES del instalador: si el build de
      # frontend falla, el instalador NO se publica (nunca empaquetar sin dist).
      - name: Node para el panel web
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar panel web (frontend/dist)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      # A partir de aca se arma el runtime de Python EMBEBIDO (paquete oficial
      # de python.org) que se bundlea en el instalador -- el cliente no
      # necesita tener Python instalado. Ninguno de estos pasos tiene
      # continue-on-error: si algo falla, el instalador NO se compila y el
      # Release pc-latest (lo que compran los clientes) nunca se sobreescribe
      # con un build roto.
      - name: Descargar Python embebido (runtime de escritorio)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyVersion = "3.11.9"
          $zipUrl = "https://www.python.org/ftp/python/$pyVersion/python-$pyVersion-embed-amd64.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile python-embed.zip
          Expand-Archive -Path python-embed.zip -DestinationPath runtime -Force
          Remove-Item python-embed.zip

      # El paquete embebido de python.org trae un python311._pth que CONTROLA
      # sys.path por completo: ignora PYTHONPATH y NO agrega el directorio
      # actual. Las rutas de adentro se resuelven contra la carpeta donde esta
      # python.exe (o sea runtime\), asi que hay que declarar las dos cosas:
      #   Lib\site-packages -> las dependencias que instala pip aca abajo
      #   ..                -> la carpeta del programa (app.py, agents/, core/),
      #                        que esta un nivel arriba de runtime\
      # Sin el ".." el propio smoke test de mas abajo falla con
      # "ModuleNotFoundError: No module named 'app'" -- y, peor, el programa
      # instalado tampoco podria importar sus modulos.
      - name: Habilitar site-packages y la carpeta del programa en el runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pth = "runtime\python311._pth"
          $content = Get-Content $pth
          $content = $content -replace '^#import site$', 'import site'
          $content += "Lib\site-packages"
          $content += ".."
          Set-Content -Path $pth -Value $content -Encoding UTF8
          Write-Host "--- python311._pth resultante ---"
          Get-Content $pth

      - name: Instalar pip en el runtime embebido
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          runtime\python.exe get-pip.py --no-warn-script-location
          Remove-Item get-pip.py

      - name: Instalar dependencias del bundle de escritorio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          runtime\python.exe -m pip install --no-warn-script-location -r requirements-desktop.txt

      # webview.platforms.edgechromium fuerza la carga real de pythonnet/
      # clr_loader (la dependencia mas fragil del bundle) -- un "import
      # webview" solo no la ejercita, pywebview la carga recien al crear la
      # ventana. "import app" ejercita TODO el grafo de imports real de la
      # app (config, core.db, cada agents/*/data/*) bajo el runtime recortado
      # -- distinto de lo que ya cubre test/test_api_local.py, que corre en
      # Linux con el requirements.txt completo, no con este runtime de Windows.
      - name: Smoke test del runtime embebido (imports)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          runtime\python.exe -c "import fastapi, uvicorn, pandas, anthropic, PIL, webview, webview.platforms.edgechromium; print('embed-ok')"
          runtime\python.exe -c "import app; print('app-import-ok')"

      - name: Smoke test del runtime embebido (arranca app.py real y pega /health)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process -FilePath "runtime\python.exe" `
               -ArgumentList "-m","uvicorn","app:app","--host","127.0.0.1","--port","8765" `
               -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "app.py no respondio /health con el runtime embebido" }
          Write-Host "functional-smoke-ok"

      # Build OWNER (solo con workflow_dispatch + owner=true): escribe la
      # licencia del dueño. El .iss la incluye con skipifsourcedoesntexist, asi
      # que el build normal la ignora. Con este archivo presente, el programa se
      # auto-activa como Pro en el primer arranque (validando contra el
      # servidor, no es un bypass).
      #
      # Dos caminos, en este orden:
      #   1. owner_email cargado a mano al lanzar el workflow -> la clave se
      #      pide sola a /api/licencia?dueno=1. Con poner el mail alcanza: no
      #      hay que configurar ningun secret. El servidor solo la entrega si
      #      ese email es exactamente el OWNER_EMAIL configurado en Vercel.
      #   2. Sin owner_email -> se usan los secrets de siempre (compatibilidad).
      - name: Escribir licencia owner (build interno)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.owner == 'true'
        shell: pwsh
        env:
          OWNER_EMAIL_INPUT: ${{ github.event.inputs.owner_email }}
          OWNER_LICENSE_EMAIL: ${{ secrets.OWNER_LICENSE_EMAIL }}
          OWNER_LICENSE_KEY: ${{ secrets.OWNER_LICENSE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          # Interpolado a string: si la variable no viene, queda "" en vez de
          # $null -- llamar .Trim() sobre $null tira "You cannot call a method
          # on a null-valued expression" y el paso moriria en vez de caer al
          # camino de los secrets.
          $email = "$($env:OWNER_EMAIL_INPUT)".Trim()
          if ($email) {
            Write-Host "Pidiendo la licencia de dueño al servidor para $email"
            $url = "https://mvfbaia.com/api/licencia?dueno=1&email=" + [uri]::EscapeDataString($email)
            try {
              $r = Invoke-RestMethod -Uri $url -Headers @{ "x-mv-app" = "mvfba-web-1" } -TimeoutSec 30
            } catch {
              throw ("El servidor rechazo la licencia de dueño para '$email'. " +
                     "Tiene que ser EXACTAMENTE el mismo email que OWNER_EMAIL en Vercel. " +
                     "Detalle: " + $_.Exception.Message)
            }
            if (-not $r.licencia) { throw "El servidor no devolvio ninguna licencia para '$email'." }
            $clave = $r.licencia
            # La clave nunca se imprime: se enmascara el log por las dudas.
            Write-Host "::add-mask::$clave"
            Write-Host "Licencia de dueño obtenida (plan: $($r.plan))"
          }
          elseif ($env:OWNER_LICENSE_EMAIL -and $env:OWNER_LICENSE_KEY) {
            $email = $env:OWNER_LICENSE_EMAIL
            $clave = $env:OWNER_LICENSE_KEY
            Write-Host "Usando los secrets OWNER_LICENSE_EMAIL / OWNER_LICENSE_KEY"
          }
          else {
            throw ("Para el build owner: cargá tu email en el campo 'owner_email' al " +
                   "lanzar el workflow (con eso alcanza), o configura los secrets " +
                   "OWNER_LICENSE_EMAIL / OWNER_LICENSE_KEY.")
          }
          $obj = @{ email = $email; clave = $clave }
          $obj | ConvertTo-Json | Set-Content -Path owner_licencia.json -Encoding UTF8

      - name: Compilar instalador
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MV_Amazon_FBA_IA.iss
        shell: pwsh

      # Build owner: renombra el .exe para no confundirlo con el de clientes.
      - name: Renombrar instalador owner
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.owner == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Move-Item -Force installer\Output\MV_Amazon_FBA_IA_Setup.exe installer\Output\MV_Amazon_FBA_IA_Owner_Setup.exe

      # El artifact es solo una conveniencia para descargar desde Actions; la
      # distribucion real a clientes es el Release pc-latest (paso siguiente),
      # que no consume la cuota de almacenamiento de artifacts. Por eso este
      # paso no voltea el build si la cuota esta llena, y retiene poco.
      - name: Publicar EXE como artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MV-Amazon-FBA-IA-instalador-windows
          path: installer/Output/MV_Amazon_FBA_IA_*Setup.exe
          if-no-files-found: error
          retention-days: 7

      # Publica/actualiza el Release "pc-latest" con el instalador de CLIENTES,
      # para que la descarga gated (api/descarga.js, tras pago verificado) lo
      # pueda entregar. NUNCA en un build owner (no debe pisar el de clientes).
      - name: Publicar instalador como Release
        if: github.ref == 'refs/heads/main' && github.event.inputs.owner != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: MV FBA IA — Instalador PC (Windows)
          body: >-
            Instalador oficial de MV FBA IA para Windows.
            La descarga se habilita tras la compra (ver /gracias.html).
          files: installer/Output/MV_Amazon_FBA_IA_Setup.exe
          make_latest: "false"

      # Build owner: publica en un Release SEPARADO (owner-latest), que el dueño
      # baja directo desde la pagina de Releases del repo privado (esta logueado
      # como dueño, sin 404). No lo consume api/descarga.js.
      - name: Publicar instalador owner como Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.owner == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-latest
          name: MV FBA IA — Instalador OWNER (interno, pre-activado)
          body: >-
            Build interno del dueño: arranca ya activado como Pro (trae la
            licencia adentro, se valida contra el servidor en el primer
            arranque). NO distribuir — es para uso propio.
          files: installer/Output/MV_Amazon_FBA_IA_Owner_Setup.exe
          make_latest: "false"
