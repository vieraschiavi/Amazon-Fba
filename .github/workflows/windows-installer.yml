# Compila el instalador .exe de Windows (Inno Setup) en un runner Windows real
# y lo publica como artifact descargable en la pestana Actions. Se dispara con
# cada push que toque el instalador o el codigo del programa, y a mano.
name: Windows Installer (EXE)

on:
  push:
    paths:
      - "installer/**"
      - "*.py"
      - "*.bat"
      - "agents/**"
      - "core/**"
      - "data/**"
      - "requirements.txt"
      - "requirements-desktop.txt"
      - "frontend/**"
      - "electron/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
    inputs:
      owner:
        description: "Build OWNER (interno, arranca pre-activado). Se publica en el Release owner-latest, NUNCA en pc-latest."
        type: boolean
        default: false
      owner_email:
        description: "Email de dueño para el build OWNER (ya viene cargado). La clave se pide sola al servidor: no hace falta ningun secret."
        type: string
        required: false
        default: "vieraschiavi@gmail.com"

# Pushes seguidos: se cancela el build del commit ya superado (ahorra cuota).
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # para publicar el Release con el instalador

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El panel SaaS (React) se compila ANTES del instalador: si el build de
      # frontend falla, el instalador NO se publica (nunca empaquetar sin dist).
      - name: Node para el panel web
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar panel web (frontend/dist)
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Reintentos: estos pasos pegan contra servicios externos (registry
          # de npm, python.org, PyPI, chocolatey). Un 503 o un corte transitorio
          # ponia el PR en rojo sin que hubiera nada mal en el codigo.
          function Reintentar([scriptblock]$accion, [string]$que) {
            for ($i = 1; $i -le 3; $i++) {
              # Se resetea ANTES: los cmdlets de PowerShell no tocan
              # $LASTEXITCODE, asi que sin esto heredarian el codigo de un
              # comando nativo anterior y un exito se leeria como fallo.
              $global:LASTEXITCODE = 0
              try {
                & $accion
                if ($LASTEXITCODE -eq 0) { return }
                throw "codigo de salida $LASTEXITCODE"
              } catch {
                if ($i -eq 3) { throw "$que fallo tras 3 intentos: $($_.Exception.Message)" }
                Write-Host "::warning::$que fallo (intento $i), reintento: $($_.Exception.Message)"
                Start-Sleep -Seconds ($i * 10)
                $global:LASTEXITCODE = 0
              }
            }
          }
          Reintentar { npm ci } "npm ci"
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build fallo" }

      # La app de escritorio es Electron: trae su propio Chromium adentro, asi
      # que la ventana abre igual en cualquier Windows. Antes se usaba pywebview
      # sobre WebView2 (componente del SISTEMA): si la maquina no lo tenia, la
      # app no podia abrir ventana y se mostraba en el navegador.
      - name: Compilar la app de escritorio (Electron)
        working-directory: electron
        run: |
          $ErrorActionPreference = "Stop"
          # Reintentos: estos pasos pegan contra servicios externos (registry
          # de npm, python.org, PyPI, chocolatey). Un 503 o un corte transitorio
          # ponia el PR en rojo sin que hubiera nada mal en el codigo.
          function Reintentar([scriptblock]$accion, [string]$que) {
            for ($i = 1; $i -le 3; $i++) {
              # Se resetea ANTES: los cmdlets de PowerShell no tocan
              # $LASTEXITCODE, asi que sin esto heredarian el codigo de un
              # comando nativo anterior y un exito se leeria como fallo.
              $global:LASTEXITCODE = 0
              try {
                & $accion
                if ($LASTEXITCODE -eq 0) { return }
                throw "codigo de salida $LASTEXITCODE"
              } catch {
                if ($i -eq 3) { throw "$que fallo tras 3 intentos: $($_.Exception.Message)" }
                Write-Host "::warning::$que fallo (intento $i), reintento: $($_.Exception.Message)"
                Start-Sleep -Seconds ($i * 10)
                $global:LASTEXITCODE = 0
              }
            }
          }
          Reintentar { npm install --no-audit --no-fund } "npm install"
          npx --yes @electron/packager . "MV FBA IA" --platform=win32 --arch=x64 `
              --out=../electron-dist --overwrite --icon=../installer/assets/icon.ico `
              --app-version=1.3.0
        shell: pwsh

      - name: Verificar que el empaquetado de Electron salio entero
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "electron-dist\MV FBA IA-win32-x64\MV FBA IA.exe"
          if (-not (Test-Path $exe)) { throw "No se genero $exe" }
          $mb = [math]::Round((Get-ChildItem "electron-dist\MV FBA IA-win32-x64" -Recurse |
                Measure-Object -Property Length -Sum).Sum / 1MB)
          Write-Host "App Electron: $mb MB"
          # Si bajara de ~100 MB es que falto el runtime de Chromium: mejor
          # cortar aca que publicar un instalador que no abre.
          if ($mb -lt 100) { throw "El empaquetado de Electron quedo incompleto ($mb MB)" }

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Reintentos: estos pasos pegan contra servicios externos (registry
          # de npm, python.org, PyPI, chocolatey). Un 503 o un corte transitorio
          # ponia el PR en rojo sin que hubiera nada mal en el codigo.
          function Reintentar([scriptblock]$accion, [string]$que) {
            for ($i = 1; $i -le 3; $i++) {
              # Se resetea ANTES: los cmdlets de PowerShell no tocan
              # $LASTEXITCODE, asi que sin esto heredarian el codigo de un
              # comando nativo anterior y un exito se leeria como fallo.
              $global:LASTEXITCODE = 0
              try {
                & $accion
                if ($LASTEXITCODE -eq 0) { return }
                throw "codigo de salida $LASTEXITCODE"
              } catch {
                if ($i -eq 3) { throw "$que fallo tras 3 intentos: $($_.Exception.Message)" }
                Write-Host "::warning::$que fallo (intento $i), reintento: $($_.Exception.Message)"
                Start-Sleep -Seconds ($i * 10)
                $global:LASTEXITCODE = 0
              }
            }
          }
          Reintentar { choco install innosetup --no-progress -y } "choco install innosetup"

      # A partir de aca se arma el runtime de Python EMBEBIDO (paquete oficial
      # de python.org) que se bundlea en el instalador -- el cliente no
      # necesita tener Python instalado. Ninguno de estos pasos tiene
      # continue-on-error: si algo falla, el instalador NO se compila y el
      # Release pc-latest (lo que compran los clientes) nunca se sobreescribe
      # con un build roto.
      - name: Descargar Python embebido (runtime de escritorio)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyVersion = "3.11.9"
          $zipUrl = "https://www.python.org/ftp/python/$pyVersion/python-$pyVersion-embed-amd64.zip"
          # Reintentos: estos pasos pegan contra servicios externos (registry
          # de npm, python.org, PyPI, chocolatey). Un 503 o un corte transitorio
          # ponia el PR en rojo sin que hubiera nada mal en el codigo.
          function Reintentar([scriptblock]$accion, [string]$que) {
            for ($i = 1; $i -le 3; $i++) {
              # Se resetea ANTES: los cmdlets de PowerShell no tocan
              # $LASTEXITCODE, asi que sin esto heredarian el codigo de un
              # comando nativo anterior y un exito se leeria como fallo.
              $global:LASTEXITCODE = 0
              try {
                & $accion
                if ($LASTEXITCODE -eq 0) { return }
                throw "codigo de salida $LASTEXITCODE"
              } catch {
                if ($i -eq 3) { throw "$que fallo tras 3 intentos: $($_.Exception.Message)" }
                Write-Host "::warning::$que fallo (intento $i), reintento: $($_.Exception.Message)"
                Start-Sleep -Seconds ($i * 10)
                $global:LASTEXITCODE = 0
              }
            }
          }
          Reintentar { Invoke-WebRequest -Uri $zipUrl -OutFile python-embed.zip } "descarga de Python embebido"
          Expand-Archive -Path python-embed.zip -DestinationPath runtime -Force
          Remove-Item python-embed.zip

      # El paquete embebido de python.org trae un python311._pth que CONTROLA
      # sys.path por completo: ignora PYTHONPATH y NO agrega el directorio
      # actual. Las rutas de adentro se resuelven contra la carpeta donde esta
      # python.exe (o sea runtime\), asi que hay que declarar las dos cosas:
      #   Lib\site-packages -> las dependencias que instala pip aca abajo
      #   ..                -> la carpeta del programa (app.py, agents/, core/),
      #                        que esta un nivel arriba de runtime\
      # Sin el ".." el propio smoke test de mas abajo falla con
      # "ModuleNotFoundError: No module named 'app'" -- y, peor, el programa
      # instalado tampoco podria importar sus modulos.
      - name: Habilitar site-packages y la carpeta del programa en el runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pth = "runtime\python311._pth"
          $content = Get-Content $pth
          $content = $content -replace '^#import site$', 'import site'
          $content += "Lib\site-packages"
          $content += ".."
          Set-Content -Path $pth -Value $content -Encoding UTF8
          Write-Host "--- python311._pth resultante ---"
          Get-Content $pth

      - name: Instalar pip en el runtime embebido
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Reintentos: estos pasos pegan contra servicios externos (registry
          # de npm, python.org, PyPI, chocolatey). Un 503 o un corte transitorio
          # ponia el PR en rojo sin que hubiera nada mal en el codigo.
          function Reintentar([scriptblock]$accion, [string]$que) {
            for ($i = 1; $i -le 3; $i++) {
              # Se resetea ANTES: los cmdlets de PowerShell no tocan
              # $LASTEXITCODE, asi que sin esto heredarian el codigo de un
              # comando nativo anterior y un exito se leeria como fallo.
              $global:LASTEXITCODE = 0
              try {
                & $accion
                if ($LASTEXITCODE -eq 0) { return }
                throw "codigo de salida $LASTEXITCODE"
              } catch {
                if ($i -eq 3) { throw "$que fallo tras 3 intentos: $($_.Exception.Message)" }
                Write-Host "::warning::$que fallo (intento $i), reintento: $($_.Exception.Message)"
                Start-Sleep -Seconds ($i * 10)
                $global:LASTEXITCODE = 0
              }
            }
          }
          Reintentar { Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py } "descarga de get-pip"
          runtime\python.exe get-pip.py --no-warn-script-location
          Remove-Item get-pip.py

      - name: Instalar dependencias del bundle de escritorio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Reintentos: estos pasos pegan contra servicios externos (registry
          # de npm, python.org, PyPI, chocolatey). Un 503 o un corte transitorio
          # ponia el PR en rojo sin que hubiera nada mal en el codigo.
          function Reintentar([scriptblock]$accion, [string]$que) {
            for ($i = 1; $i -le 3; $i++) {
              # Se resetea ANTES: los cmdlets de PowerShell no tocan
              # $LASTEXITCODE, asi que sin esto heredarian el codigo de un
              # comando nativo anterior y un exito se leeria como fallo.
              $global:LASTEXITCODE = 0
              try {
                & $accion
                if ($LASTEXITCODE -eq 0) { return }
                throw "codigo de salida $LASTEXITCODE"
              } catch {
                if ($i -eq 3) { throw "$que fallo tras 3 intentos: $($_.Exception.Message)" }
                Write-Host "::warning::$que fallo (intento $i), reintento: $($_.Exception.Message)"
                Start-Sleep -Seconds ($i * 10)
                $global:LASTEXITCODE = 0
              }
            }
          }
          Reintentar { runtime\python.exe -m pip install --no-warn-script-location -r requirements-desktop.txt } "pip install"


      # webview.platforms.edgechromium fuerza la carga real de pythonnet/
      # clr_loader (la dependencia mas fragil del bundle) -- un "import
      # webview" solo no la ejercita, pywebview la carga recien al crear la
      # ventana. "import app" ejercita TODO el grafo de imports real de la
      # app (config, core.db, cada agents/*/data/*) bajo el runtime recortado
      # -- distinto de lo que ya cubre test/test_api_local.py, que corre en
      # Linux con el requirements.txt completo, no con este runtime de Windows.
      - name: Smoke test del runtime embebido (imports)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          runtime\python.exe -c "import fastapi, uvicorn, pandas, anthropic, PIL, webview, webview.platforms.edgechromium; print('embed-ok')"
          runtime\python.exe -c "import app; print('app-import-ok')"

      - name: Smoke test del runtime embebido (arranca app.py real y pega /health)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process -FilePath "runtime\python.exe" `
               -ArgumentList "-m","uvicorn","app:app","--host","127.0.0.1","--port","8765" `
               -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "app.py no respondio /health con el runtime embebido" }
          Write-Host "functional-smoke-ok"

      # Version "sin instalador": el MISMO app.py, el MISMO runtime embebido
      # (ya probado arriba con el smoke test funcional) y la MISMA base de
      # licencia que el .exe -- solo que en un .zip que se descomprime y se
      # corre con un doble clic en INICIAR.bat. Existe para las PCs de empresa
      # donde la politica de seguridad bloquea ejecutar .exe bajados de
      # internet (SmartScreen/AppLocker) pero SI permite .bat/.vbs.
      #
      # Lista de archivos deliberadamente explicita, en espejo de [Files] en
      # el .iss (mismos excludes: sin dashboard_app.py/styles.py/i18n.py, sin
      # el .pyc, sin los .csv de data/) para que ninguna de las dos versiones
      # filtre algo que la otra ya sabe que no debe filtrar. Se excluye ademas
      # APP_ESCRITORIO.bat/desktop.py a proposito: esa via necesita WebView2
      # (componente del SISTEMA) para abrir ventana nativa -- la razon de ser
      # de esta version portable es funcionar SIEMPRE, y en las maquinas mas
      # restringidas (el publico objetivo de este .zip) es tanto o mas
      # probable que falte WebView2 como que este bloqueado el .exe. Con
      # INICIAR.bat el panel abre en el navegador, sin esa dependencia.
      - name: Armar la version portable (.zip, sin instalador)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dst = "portable-dist\MV FBA IA"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $excluirPy = @("dashboard_app.py", "styles.py", "desktop.py")
          Get-ChildItem *.py | Where-Object { $excluirPy -notcontains $_.Name } |
            Copy-Item -Destination $dst

          $excluirBat = @("LEGACY_STREAMLIT.bat", "APP_ESCRITORIO.bat")
          Get-ChildItem *.bat | Where-Object { $excluirBat -notcontains $_.Name } |
            Copy-Item -Destination $dst

          Copy-Item README.md, CONEXIONES.md, requirements.txt, .env.example -Destination $dst
          Copy-Item installer\assets\icon.ico -Destination (New-Item -ItemType Directory -Force -Path "$dst\assets").FullName
          Copy-Item installer\Iniciar_Silencioso.vbs -Destination $dst
          Copy-Item installer\portable\LEEME_PORTABLE.md, installer\portable\crear_accesos.vbs, `
                     installer\portable\CREAR_ACCESOS_DIRECTOS.bat, installer\portable\DESINSTALAR.bat `
                     -Destination $dst
          if (Test-Path owner_licencia.json) { Copy-Item owner_licencia.json -Destination $dst }

          # robocopy en vez de Copy-Item -Recurse -Exclude: mas confiable
          # filtrando por nombre en TODA la profundidad del arbol, no solo en
          # el primer nivel. Los codigos de salida 0-7 son exito (1 = "se
          # copiaron archivos", no un error); 8+ es el unico caso real de
          # fallo, asi que se valida a mano en vez de dejar que
          # $ErrorActionPreference lo interprete solo.
          function Copiar-Carpeta($origen, $destino, $excluir) {
            robocopy $origen $destino /E /XF $excluir /NFL /NDL /NJH /NJS | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy fallo copiando $origen (codigo $LASTEXITCODE)" }
            # robocopy devuelve 0-7 en EXITO (1 = "se copiaron archivos", el caso
            # normal aca) -- pero un $LASTEXITCODE no-cero que quede COLGADO al
            # final del script hace que GitHub Actions marque el STEP entero como
            # fallido, aunque nada haya tirado una excepcion (el wrapper de pwsh
            # de Actions chequea $LASTEXITCODE al terminar, no solo si hubo throw).
            # Sin este reset, la ULTIMA llamada a robocopy (la de runtime\, la mas
            # pesada) deja pegado un exit code de "1 archivo copiado" que ningun
            # cmdlet de PowerShell de ahi en mas pisa (Compress-Archive, Get-Item,
            # Write-Host no tocan $LASTEXITCODE), y el paso muere en silencio
            # DESPUES de haber armado el .zip entero y bien.
            $global:LASTEXITCODE = 0
          }
          Copiar-Carpeta "agents" "$dst\agents" "*.pyc"
          Copiar-Carpeta "core" "$dst\core" @("*.pyc", "i18n.py")
          Copiar-Carpeta "data" "$dst\data" @("*.pyc", "*.csv")
          Copiar-Carpeta "frontend\dist" "$dst\frontend\dist" @()
          Copiar-Carpeta "runtime" "$dst\runtime" @()

          $zipName = if ($env:ES_OWNER -eq "true") { "MV_FBA_IA_Portable_Owner.zip" } else { "MV_FBA_IA_Portable.zip" }
          Compress-Archive -Path "$dst\*" -DestinationPath "portable-dist\$zipName" -Force
          $mb = [math]::Round((Get-Item "portable-dist\$zipName").Length / 1MB)
          Write-Host "Version portable: $mb MB ($zipName)"
          # Umbral BAJO a proposito (no se puede medir el tamaño real sin
          # correr este paso en Windows): solo busca atajar el caso obvio de
          # un runtime\ que no se copio o un zip vacio/corrupto, sin arriesgar
          # un falso positivo por no conocer el peso exacto de antemano.
          if ($mb -lt 20) { throw "El .zip portable quedo chico ($mb MB): revisar que runtime\ se haya copiado entero." }
        env:
          ES_OWNER: ${{ github.event.inputs.owner }}

      # Smoke test de la version portable: se descomprime en OTRA carpeta (no
      # la que se usó para armarla) y se arranca con el runtime que trae
      # ADENTRO DEL ZIP -- prueba que lo que de verdad recibe el cliente
      # funciona, no que la carpeta de staging funcionaba antes de comprimir.
      - name: Smoke test de la version portable (arranca desde el .zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipName = if ($env:ES_OWNER -eq "true") { "MV_FBA_IA_Portable_Owner.zip" } else { "MV_FBA_IA_Portable.zip" }
          Expand-Archive -Path "portable-dist\$zipName" -DestinationPath "portable-smoke" -Force
          # El paso anterior comprime con "-Path `"$dst\*`"" (items SUELTOS de la
          # carpeta de staging, no la carpeta en si): el .zip NO tiene una carpeta
          # contenedora adentro -- app.py, runtime\, agents\, etc. quedan sueltos
          # en la raiz del .zip. Buscar "la primera carpeta" aca (como se hacia
          # antes) agarraba "agents" en vez de la raiz real -- por eso se referencia
          # "portable-smoke\..." directo, sin indireccion por Get-ChildItem.
          $p = Start-Process -FilePath "portable-smoke\runtime\python.exe" `
               -ArgumentList "-m","uvicorn","app:app","--host","127.0.0.1","--port","8766" `
               -WorkingDirectory "portable-smoke" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8766/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Remove-Item "portable-smoke" -Recurse -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "La version portable descomprimida no respondio /health" }
          Write-Host "portable-smoke-ok"
        env:
          ES_OWNER: ${{ github.event.inputs.owner }}

      - name: Compilar instalador
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MV_Amazon_FBA_IA.iss
        shell: pwsh

      # Publica/actualiza el Release "pc-latest" con las DOS versiones para
      # CLIENTES (el .exe con instalador y el .zip portable sin instalador),
      # para que la descarga gated (api/descarga.js, tras pago verificado) las
      # pueda entregar. NUNCA en un build owner (no debe pisar el de clientes).
      - name: Publicar instalador como Release
        if: github.ref == 'refs/heads/main' && github.event.inputs.owner != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: MV FBA IA — Instalador PC (Windows)
          body: >-
            Instalador oficial de MV FBA IA para Windows. La descarga se
            habilita tras la compra (ver /gracias.html). Incluye dos
            versiones: el instalador .exe (icono de Escritorio, Menú Inicio y
            desinstalador) y una versión portable .zip sin instalador — para
            PCs donde la política de la empresa bloquea ejecutar .exe.
          files: |
            installer/Output/MV_Amazon_FBA_IA_Setup.exe
            portable-dist/MV_FBA_IA_Portable.zip
          make_latest: "false"

      # ---------------- GUARDIA DE VISIBILIDAD ----------------
      # El Release owner-latest lleva un instalador PRE-ACTIVADO como Pro. Todo
      # el diseño asume un repositorio PRIVADO: ahi ese Release solo lo ve el
      # dueño. En un repo PUBLICO los Releases son URLs publicas, asi que
      # publicarlo equivale a regalar el producto completo a cualquiera que
      # tenga el link -- y encima en silencio, porque el build queda verde.
      #
      # Por eso la visibilidad se chequea ACA y no se confia en que nadie se
      # olvide: si el repo es publico, el bloque owner entero no corre.
      - name: Guardia de visibilidad del repositorio
        id: owner_guard
        if: github.ref == 'refs/heads/main' || github.event.inputs.owner == 'true'
        shell: pwsh
        run: |
          $privado = "${{ github.event.repository.private }}"
          if ($privado -eq "true") {
            Write-Host "Repositorio privado: el instalador owner se puede publicar."
            "publicar=si" | Out-File -Append $env:GITHUB_OUTPUT
          } else {
            "publicar=no" | Out-File -Append $env:GITHUB_OUTPUT
            Write-Host "::warning::Repositorio PUBLICO: no se publica owner-latest. Un Release publico con el instalador pre-activado como Pro lo puede bajar cualquiera. Pone el repo en privado, o activa tu copia con INSTALADOR\ACTIVAR_OWNER.bat sobre el instalador normal."
            "- Build **owner** omitido: el repositorio es publico y el instalador pre-activado quedaria al alcance de cualquiera." | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

      # ----------------------- BLOQUE OWNER -----------------------
      # Corre en CADA push a main (y tambien a mano con owner=true), asi
      # SIEMPRE hay un instalador owner fresco en el Release owner-latest
      # para probar el programa completo. Va DESPUES de compilar y publicar
      # el de clientes: owner_licencia.json todavia no existia cuando se
      # armo ese .exe, asi que el instalador de clientes NUNCA puede salir
      # pre-activado. Esa separacion es la garantia de seguridad.
      #
      # Build OWNER: escribe la
      # licencia del dueño. El .iss la incluye con skipifsourcedoesntexist, asi
      # que el build normal la ignora. Con este archivo presente, el programa se
      # auto-activa como Pro en el primer arranque (validando contra el
      # servidor, no es un bypass).
      #
      # Dos caminos, en este orden:
      #   1. owner_email cargado a mano al lanzar el workflow -> la clave se
      #      pide sola a /api/licencia?dueno=1. Con poner el mail alcanza: no
      #      hay que configurar ningun secret. El servidor solo la entrega si
      #      ese email es exactamente el OWNER_EMAIL configurado en Vercel.
      #   2. Sin owner_email -> se usan los secrets de siempre (compatibilidad).
      - name: Escribir licencia owner (build interno)
        id: owner_lic
        if: (github.ref == 'refs/heads/main' || github.event.inputs.owner == 'true') && steps.owner_guard.outputs.publicar == 'si'
        continue-on-error: true
        shell: pwsh
        env:
          OWNER_EMAIL_INPUT: ${{ github.event.inputs.owner_email || 'vieraschiavi@gmail.com' }}
          # Token efimero de Actions. OJO: con el repo PUBLICO no alcanza --
          # es un installation token y la API NO devuelve "permissions" para
          # el, asi que la verificacion de escritura del servidor da false.
          # Sirve solo si el repo es privado.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_BUILD_TOKEN: ${{ secrets.OWNER_BUILD_TOKEN }}
          OWNER_LICENSE_EMAIL: ${{ secrets.OWNER_LICENSE_EMAIL }}
          OWNER_LICENSE_KEY: ${{ secrets.OWNER_LICENSE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $email = "$($env:OWNER_EMAIL_INPUT)".Trim()

          # ORDEN: primero los secrets, despues el servidor.
          #
          # Antes era al reves y, peor, la rama de los secrets era CODIGO
          # MUERTO: el email pasó a tener un valor por defecto, con lo cual
          # "if ($email)" daba siempre verdadero y nunca se llegaba al
          # elseif. Con los secrets primero, el build owner no depende de que
          # la web este arriba ni de que el token pase la verificacion.
          if ($env:OWNER_LICENSE_EMAIL -and $env:OWNER_LICENSE_KEY) {
            $email = $env:OWNER_LICENSE_EMAIL
            $clave = $env:OWNER_LICENSE_KEY
            Write-Host "::add-mask::$email"
            Write-Host "::add-mask::$clave"
            Write-Host "Licencia de dueño tomada de los secrets OWNER_LICENSE_EMAIL/KEY"
          }
          elseif ($email) {
            # Ni el email ni la clave se imprimen: quedarian en el log del
            # workflow, y con ese email cualquiera puede pedirle una licencia
            # Pro al servidor.
            Write-Host "::add-mask::$email"
            Write-Host "Pidiendo la licencia de dueño al servidor"
            $url = "https://mvfbaia.com/api/licencia?dueno=1&email=" + [uri]::EscapeDataString($email)
            $cabeceras = @{ "x-mv-app" = "mvfba-web-1"; "x-mv-github-token" = $env:GITHUB_TOKEN }
            if ($env:OWNER_BUILD_TOKEN) { $cabeceras["x-mv-owner-build"] = $env:OWNER_BUILD_TOKEN }
            try {
              $r = Invoke-RestMethod -Uri $url -TimeoutSec 30 -Headers $cabeceras
            } catch {
              # El CUERPO de la respuesta dice cual de las dos barreras fallo
              # (no_autorizado_repo vs email_no_coincide). Sin esto el mensaje
              # culpaba siempre al email, aunque el problema fuera el token --
              # que es exactamente lo que paso en el primer build owner real.
              $detalle = $_.Exception.Message
              if ($_.ErrorDetails -and $_.ErrorDetails.Message) {
                $detalle = $detalle + " | respuesta del servidor: " + $_.ErrorDetails.Message
              }
              throw ("El servidor rechazo la licencia de dueño. " +
                     "Si dice no_autorizado_repo, el token no probo acceso de escritura al repo " +
                     "(con el repo PUBLICO el GITHUB_TOKEN de Actions no trae 'permissions': " +
                     "hay que configurar OWNER_BUILD_TOKEN, o los secrets OWNER_LICENSE_EMAIL/KEY). " +
                     "Si dice email_no_coincide, no es el mismo email que OWNER_EMAIL en Vercel. " +
                     "Detalle: " + $detalle)
            }
            if (-not $r.licencia) { throw "El servidor no devolvio ninguna licencia." }
            $clave = $r.licencia
            Write-Host "::add-mask::$clave"
            Write-Host "Licencia de dueño obtenida (plan: $($r.plan))"
          }
          else {
            throw ("Para el build owner: configura los secrets OWNER_LICENSE_EMAIL / " +
                   "OWNER_LICENSE_KEY, o cargá tu email en el campo 'owner_email' al " +
                   "lanzar el workflow.")
          }
          $obj = @{ email = $email; clave = $clave }
          $obj | ConvertTo-Json | Set-Content -Path owner_licencia.json -Encoding UTF8

      # Guarda contra el peor final silencioso del build owner: el .iss incluye
      # owner_licencia.json con skipifsourcedoesntexist, asi que si el archivo
      # no estuviera, compilaria igual -- y se publicaria en owner-latest un
      # instalador que NO viene pre-activado, con cara de owner. Se corta antes.
      - name: Verificar que el build owner lleva la licencia adentro
        id: owner_ver
        if: (github.ref == 'refs/heads/main' || github.event.inputs.owner == 'true') && steps.owner_lic.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path owner_licencia.json)) {
            throw "Build owner sin owner_licencia.json: el instalador saldria SIN pre-activar."
          }
          $d = Get-Content owner_licencia.json -Raw | ConvertFrom-Json
          if (-not $d.email -or -not $d.clave) {
            throw "owner_licencia.json existe pero le falta email o clave."
          }
          if ($d.clave -notmatch '^MVFBA(-[A-F0-9]{4}){4}$') {
            throw "La clave de owner no tiene el formato MVFBA-XXXX-XXXX-XXXX-XXXX."
          }
          Write-Host "owner_licencia.json OK (formato de clave valido)"

      # El .exe owner se compila en SU PROPIA carpeta de salida (/O): asi no
      # pisa el de clientes, que ya quedo publicado en pc-latest. Reusa el
      # frontend, el Electron y el runtime ya compilados -- solo vuelve a
      # correr ISCC, que son un par de minutos.
      - name: Compilar instalador owner
        id: owner_exe
        if: (github.ref == 'refs/heads/main' || github.event.inputs.owner == 'true') && steps.owner_ver.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Ruta ABSOLUTA a proposito: el OutputDir del .iss se resuelve contra
          # la carpeta del script (installer\), pero el /O de la linea de
          # comandos se resuelve contra el directorio actual. Con una ruta
          # relativa el .exe podia terminar en installer\installer\Output\owner
          # y el Move-Item de abajo fallaba sin explicar por que.
          $salida = Join-Path (Get-Location).Path "installer\Output\owner"
          New-Item -ItemType Directory -Force -Path $salida | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /O"$salida" installer\MV_Amazon_FBA_IA.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fallo compilando el instalador owner ($LASTEXITCODE)" }
          Move-Item -Force (Join-Path $salida "MV_Amazon_FBA_IA_Setup.exe") `
                           (Join-Path $salida "MV_Amazon_FBA_IA_Owner_Setup.exe")
          $mb = [math]::Round((Get-Item "installer\Output\owner\MV_Amazon_FBA_IA_Owner_Setup.exe").Length / 1MB)
          Write-Host "Instalador owner: $mb MB"
          if ($mb -lt 50) { throw "El instalador owner quedo chico ($mb MB)" }

      # Portable owner: se le agrega la licencia al MISMO staging que ya armo
      # la version de clientes y se re-comprime con otro nombre.
      - name: Armar la version portable owner (.zip)
        id: owner_zip
        if: (github.ref == 'refs/heads/main' || github.event.inputs.owner == 'true') && steps.owner_exe.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dst = "portable-dist\MV FBA IA"
          if (-not (Test-Path $dst)) { throw "no existe el staging de la version portable" }
          Copy-Item owner_licencia.json -Destination $dst -Force
          Compress-Archive -Path "$dst\*" -DestinationPath "portable-dist\MV_FBA_IA_Portable_Owner.zip" -Force
          $mb = [math]::Round((Get-Item "portable-dist\MV_FBA_IA_Portable_Owner.zip").Length / 1MB)
          Write-Host "Portable owner: $mb MB"
          if ($mb -lt 20) { throw "El .zip portable owner quedo chico ($mb MB)" }

      # Build owner: publica en un Release SEPARADO (owner-latest), que el dueño
      # baja directo desde la pagina de Releases del repo privado (esta logueado
      # como dueño, sin 404). No lo consume api/descarga.js.
      - name: Publicar instalador owner como Release
        id: owner_pub
        if: (github.ref == 'refs/heads/main' || github.event.inputs.owner == 'true') && steps.owner_zip.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-latest
          name: MV FBA IA — Instalador OWNER (interno, pre-activado)
          body: >-
            Build interno del dueño: arranca ya activado como Pro (trae la
            licencia adentro, se valida contra el servidor en el primer
            arranque). NO distribuir — es para uso propio. Incluye el .exe y
            la version portable .zip, las dos pre-activadas.
          files: |
            installer/Output/owner/MV_Amazon_FBA_IA_Owner_Setup.exe
            portable-dist/MV_FBA_IA_Portable_Owner.zip
          make_latest: "false"

      # El bloque owner es "best effort": no puede voltear el build, porque el
      # instalador de CLIENTES ya se compilo y se publico antes. Pero un
      # salteo SILENCIOSO seria peor -- el dueño creeria que tiene un .exe
      # fresco en owner-latest cuando en realidad quedo el de la vez pasada.
      # Este paso deja el estado a la vista en el resumen del run.
      - name: Resumen del build owner
        if: github.ref == 'refs/heads/main' || github.event.inputs.owner == 'true'
        shell: pwsh
        run: |
          $pub = "${{ steps.owner_pub.outcome }}"
          $lic = "${{ steps.owner_lic.outcome }}"
          $exe = "${{ steps.owner_exe.outcome }}"
          if ($pub -eq "success") {
            Write-Host "Instalador owner publicado en el Release owner-latest."
            "- Instalador **owner** publicado en ``owner-latest``." | Out-File -Append $env:GITHUB_STEP_SUMMARY
          } else {
            $donde = if ($lic -ne "success") { "pedir la licencia al servidor" }
                     elseif ($exe -ne "success") { "compilar el .exe" }
                     else { "publicar el Release" }
            Write-Host "::warning::El build owner no se completo (fallo al $donde). El Release owner-latest sigue con la version anterior. El instalador de CLIENTES no se vio afectado."
            "- ATENCION: el build **owner** no se completo (fallo al $donde). ``owner-latest`` quedo con la version anterior." | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

      # El artifact es solo una conveniencia para descargar desde Actions; la
      # distribucion real a clientes es el Release pc-latest (paso siguiente),
      # que no consume la cuota de almacenamiento de artifacts. Por eso este
      # paso no voltea el build si la cuota esta llena, y retiene poco.
      - name: Publicar EXE como artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MV-Amazon-FBA-IA-instalador-windows
          path: installer/Output/**/MV_Amazon_FBA_IA_*Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publicar version portable como artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MV-Amazon-FBA-IA-portable-sin-instalador
          path: portable-dist/MV_FBA_IA_Portable*.zip
          if-no-files-found: error
          retention-days: 7
