# Compila la app iOS de MV FBA IA en un runner macOS para el Simulador de
# iOS. Esto CONFIRMA que el proyecto compila sin errores, sin necesitar
# ninguna cuenta de Apple ni certificados (los builds de simulador no se firman).
#
# No genera un .ipa instalable en un iPhone real: eso requiere una cuenta Apple
# Developer (US$99/año) y firma con tus certificados — ver ios/README.md.
#
# OJO con la cuota: los minutos de macOS cuentan a tarifa 10x en repos
# privados — este es, por lejos, el workflow que mas cuota de Actions quema.
# Por eso corre SOLO cuando cambia el proyecto nativo (ios/**): un cambio de
# mobile/** (el JS/HTML que la app envuelve) no altera si Xcode compila o no,
# asi que gastar 10x por cada retoque de la PWA no aporta nada. Para forzar
# un build con la UI movil nueva: pestana Actions -> Run workflow.
name: iOS Build (Simulador)

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

# Si llegan varios pushes seguidos, el build viejo se cancela solo: pagar
# minutos 10x por compilar un commit ya superado es tirar cuota.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode
        run: cd ios && xcodegen generate

      - name: Elegir el simulador de iOS disponible
        id: sim
        run: |
          NAME=$(xcrun simctl list devicetypes | grep -m1 "iPhone 15" | sed -E 's/ \(com.*//')
          if [ -z "$NAME" ]; then NAME="iPhone 15"; fi
          echo "device=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compilar para el Simulador de iOS (sin firma)
        run: |
          cd ios
          xcodebuild build \
            -project MVAmazonFBAIA.xcodeproj \
            -scheme MVAmazonFBAIA \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
