// app/build.gradle — MV FBA IA (app Android nativa).
//
// Sin dependencias externas: usa el WebView del framework y android.app.Activity
// a proposito — build rapido, APK chico (~1-2 MB) y cero librerias que mantener.
// La interfaz (mobile/) se embebe como assets en el APK via syncWebAssets, asi
// la app funciona aunque el telefono no tenga acceso al hosting de la PWA:
// solo necesita alcanzar la API del negocio (Config dentro de la app).
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mv.amazonfbaia'
    compileSdk 34

    defaultConfig {
        // applicationId NUEVO a proposito: la app anterior (com.mv.amazonfbaia)
        // pudo quedar instalada firmada con otra clave, y MIUI rechaza el update
        // ("no se instalo"). Con un package fresco instala limpio, sin conflicto,
        // igual que cualquier app nueva. El namespace/clase Java no cambia.
        applicationId "com.mvtrade.fbaia"
        minSdk 24            // Android 7.0+ (~98% de los dispositivos activos)
        targetSdk 34
        versionCode 7
        versionName "1.1.5"
    }

    // Firma de distribucion (sideload). Para una app que se instala por fuera
    // de Play Store, la firma sirve para identificar de forma consistente al
    // emisor y permitir updates -- eso sigue siendo cierto y es por lo que el
    // MISMO keystore se reusa entre builds. Lo que cambio es que la clave y su
    // contraseña YA NO viajan en texto plano dentro de un archivo trackeado:
    // antes cualquiera que leyera este .gradle (y cualquiera que hubiera
    // clonado el repo mientras fue publico) tenia la contraseña completa.
    //
    // Ahora salen de variables de entorno, que en CI vienen de GitHub Actions
    // Secrets (ver .github/workflows/android-apk.yml) y en una maquina local
    // las carga quien compila, nunca commiteadas. Sin las tres, el build
    // falla ACA con un mensaje claro -- no arranca con una contraseña de
    // repuesto ni compila "silenciosamente sin firmar".
    //
    // Se firma con v1 (JAR) + v2 + v3 a la vez: v1 es imprescindible para que
    // los instaladores de APK de terceros y los Android 7-9 reconozcan el
    // paquete (sin v1, muchos "no detectan la APK").
    def ksPath = System.getenv('MVFBA_KEYSTORE_PATH') ?: 'mv-release.keystore'
    def ksPass = System.getenv('MVFBA_KEYSTORE_PASSWORD')
    def ksAlias = System.getenv('MVFBA_KEY_ALIAS') ?: 'mvfba-release'
    signingConfigs {
        release {
            if (ksPass == null || ksPass.isEmpty()) {
                throw new GradleException(
                    "Falta MVFBA_KEYSTORE_PASSWORD. Sin esta variable de entorno " +
                    "no se puede firmar el APK -- no hay contraseña de repuesto. " +
                    "Ver android/README.md (o el workflow de Actions) para como cargarla.")
            }
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias ksAlias
            keyPassword ksPass   // PKCS12 exige la misma password para store y key
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // El APK debug tambien firmado con v1+v2+v3, por si se distribuye ese.
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// La UI web (mobile/) es la unica fuente de verdad: se copia dentro del APK
// en cada build, nunca se edita a mano en assets/.
tasks.register('syncWebAssets', Copy) {
    from("${rootProject.projectDir}/../mobile") {
        exclude 'README.md'
    }
    into "${projectDir}/src/main/assets/www"
}
preBuild.dependsOn syncWebAssets

clean {
    delete "${projectDir}/src/main/assets/www"
}
