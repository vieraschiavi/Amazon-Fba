// app/build.gradle — MV Amazon FBA IA (app Android nativa).
//
// Sin dependencias externas: usa el WebView del framework y android.app.Activity
// a proposito — build rapido, APK chico (~1-2 MB) y cero librerias que mantener.
// La interfaz (mobile/) se embebe como assets en el APK via syncWebAssets, asi
// la app funciona aunque el telefono no tenga acceso al hosting de la PWA:
// solo necesita alcanzar la API del negocio (Config dentro de la app).
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mv.amazonfbaia'
    compileSdk 34

    defaultConfig {
        applicationId "com.mv.amazonfbaia"
        minSdk 24            // Android 7.0+ (~98% de los dispositivos activos)
        targetSdk 34
        versionCode 3
        versionName "1.1.1"
    }

    // Firma de distribucion (sideload). El keystore viaja en el repo a proposito:
    // para una app que se instala por fuera de Play Store, la firma solo sirve
    // para identificar de forma consistente al emisor y permitir updates; no es
    // un secreto que proteja datos del usuario. Se firma con v1 (JAR) + v2 + v3
    // a la vez: v1 es imprescindible para que los instaladores de APK de terceros
    // y los Android 7-9 reconozcan el paquete (sin v1, muchos "no detectan la APK").
    signingConfigs {
        release {
            storeFile file('mv-release.keystore')
            storePassword 'mvfba2026'
            keyAlias 'mvfba'
            keyPassword 'mvfba2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // El APK debug tambien firmado con v1+v2+v3, por si se distribuye ese.
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// La UI web (mobile/) es la unica fuente de verdad: se copia dentro del APK
// en cada build, nunca se edita a mano en assets/.
tasks.register('syncWebAssets', Copy) {
    from("${rootProject.projectDir}/../mobile") {
        exclude 'README.md'
    }
    into "${projectDir}/src/main/assets/www"
}
preBuild.dependsOn syncWebAssets

clean {
    delete "${projectDir}/src/main/assets/www"
}
