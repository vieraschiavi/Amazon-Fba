<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Gracias por tu compra! — MV FBA IA</title>
<meta name="description" content="Confirmación de compra de MV FBA IA: tu clave de licencia y la descarga del instalador.">
<!-- Sin tags og:/twitter: A PROPOSITO. Esta pagina es noindex porque muestra la
     clave de licencia del comprador: no queremos que se indexe ni que al pegar
     el link en WhatsApp o Slack se genere una tarjeta con vista previa. -->
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{--navy-700:#152a63;--navy-900:#0a1530;--accent:#f0ac3f;--ink:#0f172a;--line:#e2e8f0;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(165deg,var(--navy-700),var(--navy-900));color:#fff;min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;padding:32px 18px 60px}
  .card{background:#fff;color:var(--ink);border-radius:20px;max-width:560px;width:100%;
    padding:30px 26px;box-shadow:0 30px 70px -25px rgba(0,0,0,.6)}
  .mk{display:inline-flex;width:52px;height:52px;border-radius:14px;align-items:center;justify-content:center;
    font-weight:800;font-size:24px;background:var(--navy-700);color:#fff;margin-bottom:14px}
  .mk i{color:#63c26b;font-style:normal}
  h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:#475569;font-size:15px;margin:0 0 22px;line-height:1.5}
  .estado{font-size:14px;color:#475569}
  .lic-box{background:#f8fafc;border:1px dashed var(--accent);border-radius:14px;padding:18px;text-align:center;margin:18px 0}
  .lic-label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a5407}
  .lic-key{font-size:24px;font-weight:800;letter-spacing:2px;color:var(--navy-700);margin:8px 0;font-family:ui-monospace,Menlo,Consolas,monospace;user-select:all;word-break:break-all}
  .copiar{background:var(--navy-700);color:#fff;border:0;border-radius:9px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer}
  .email-note{font-size:13px;color:#475569;margin-top:10px}
  .dl{display:grid;gap:10px;margin-top:20px}
  .btn{display:flex;align-items:center;gap:10px;justify-content:center;text-decoration:none;
    padding:13px 16px;border-radius:11px;font-weight:800;font-size:14.5px}
  .btn-a{background:var(--accent);color:#241705}
  .btn-b{background:#fff;color:var(--navy-700);border:1.5px solid var(--line)}
  .pasos{font-size:13.5px;color:#475569;line-height:1.6;margin-top:20px;background:#f8fafc;border-radius:12px;padding:14px 16px}
  .pasos b{color:var(--ink)}
  .ayuda-win summary{cursor:pointer;font-weight:700;color:var(--ink);list-style:none}
  .ayuda-win summary::-webkit-details-marker{display:none}
  .ayuda-win-cuerpo{margin-top:10px}
  .ayuda-win-cuerpo p{margin:0 0 8px}
  .ayuda-win code{background:#eef2f7;border-radius:5px;padding:1px 5px;font-size:12.5px}
  .err{background:#fef2f2;color:#991b1b;border-radius:12px;padding:16px;font-size:14px}
  .foot{margin-top:22px;font-size:12.5px;color:#94a3b8;text-align:center}
  a.link{color:#8a5407;font-weight:700}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--navy-700);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .garantia-box{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .garantia-box summary{cursor:pointer;font-size:13.5px;font-weight:700;color:#475569;list-style:none}
  .garantia-box summary::-webkit-details-marker{display:none}
  .garantia-box summary::before{content:"✔ ";color:#3f9142}
  .garantia-cuerpo{margin-top:12px}
  .garantia-cuerpo p{font-size:13px;color:#475569;line-height:1.5;margin:0 0 10px}
  .garantia-cuerpo input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;margin-bottom:10px}
  .btn-reembolso{width:100%;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:9px;padding:11px;font-weight:700;font-size:13.5px;cursor:pointer}
  .reembolso-msg{font-size:13px;margin-top:10px}
  .reembolso-msg.ok{color:#3f9142;font-weight:700}
  .reembolso-msg.mal{color:#991b1b}
  .resena-box{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .resena-box h3{font-size:15px;margin:0 0 8px}
  .estrellas{display:flex;gap:6px;margin-bottom:10px}
  .estrellas button{background:none;border:0;font-size:26px;cursor:pointer;color:#d1d5db;padding:0;line-height:1}
  .estrellas button.on{color:var(--accent)}
  .resena-box textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;
    font-family:inherit;resize:vertical;min-height:70px;margin-bottom:10px}
  .btn-resena{width:100%;background:var(--navy-700);color:#fff;border:0;border-radius:9px;padding:11px;font-weight:700;font-size:13.5px;cursor:pointer}
  .btn-resena:disabled{opacity:.6;cursor:default}
  .resena-msg{font-size:13px;margin-top:10px}
  .resena-msg.ok{color:#3f9142;font-weight:700}
  .resena-msg.mal{color:#991b1b}
</style>
</head>
<body>
<div class="card">
  <div class="mk">M<i>V</i></div>
  <h1 id="titulo">Confirmando tu pago…</h1>
  <p class="sub" id="sub">Un segundo, estamos verificando el pago con MercadoPago.</p>
  <div id="cargando"><div class="spin"></div></div>
  <div id="contenido" style="display:none"></div>
  <div class="foot">MV FBA IA · ¿Dudas? <a class="link" href="mailto:vieraschiavi@gmail.com">vieraschiavi@gmail.com</a></div>
</div>
<script>
// Bug pre-existente encontrado al probar el widget de reseñas: TODOS los
// llamados pasan el selector con "#" (ej. $("#titulo")), pero esto usaba
// getElementById (que necesita el id SIN el "#") -> devolvia null siempre y
// mostrarAprobado/mostrarError rompian con un TypeError apenas se llamaban.
// querySelector si acepta "#id" -- mismo criterio que ya usa mobile/js/app.js.
const $ = (sel) => document.querySelector(sel);
function params(){ const p = new URLSearchParams(location.search); const o={}; for (const [k,v] of p) o[k]=v; return o; }
// d.email viene de api/licencia.js (payer.email de MercadoPago/PayPal): dato
// de una API EXTERNA, no algo que este archivo controle. d.licencia en cambio
// es siempre "MVFBA-XXXX-XXXX-XXXX-XXXX" (api/_licencia.js: hex + guiones),
// asi que no necesita escape -- pero el email si, antes de ir a innerHTML.
function escaparHtml(s){ const d = document.createElement("div"); d.textContent = String(s||""); return d.innerHTML; }

// Que descarga habilita cada plan. Es el ESPEJO de INCLUYE en
// api/descarga.js: el servidor es el que manda (ahi se valida de verdad),
// pero si aca mostraramos botones que el servidor va a rechazar, el cliente
// que acaba de pagar recibe un 403 justo despues de darnos la plata. Si los
// dos lados se desincronizan, gana el servidor y se ve como boton roto: por
// eso conviene tocar los dos juntos.
const INCLUYE_PLAN = {
  starter: ["apk"],
  pro: ["", "bat", "apk"],
};
function botonesDescarga(d){
  const pid = encodeURIComponent(d._pid || "");
  const proc = d._proc ? "&proc=" + encodeURIComponent(d._proc) : "";
  const permitidos = INCLUYE_PLAN[String(d.plan || "").trim().toLowerCase()];
  // Plan no reconocido (por ejemplo un pack de creditos de IA, que es una
  // compra valida pero no da derecho a ningun programa): no se inventan
  // botones, se explica.
  if (!permitidos) {
    return `<p class="email-note">Esta compra no incluye descarga de programa.
      Si esperabas una, escribinos a
      <a class="link" href="mailto:vieraschiavi@gmail.com">vieraschiavi@gmail.com</a>.</p>`;
  }
  const BOTONES = [
    ["apk", "btn-a", "↓ Descargar app Android (APK)", "tipo=apk&"],
    ["",    "btn-b", "↓ Programa para PC (Windows)", ""],
    ["bat", "btn-b", "↓ PC sin instalador (.zip, si tu empresa bloquea .exe)", "tipo=bat&"],
  ];
  return BOTONES
    .filter(([tipo]) => permitidos.includes(tipo))
    .map(([, clase, texto, qs]) =>
      `<a class="btn ${clase}" href="/api/descarga?${qs}payment_id=${pid}${proc}">${texto}</a>`)
    .join("\n      ");
}

function mostrarAprobado(d){
  $("#titulo").textContent = "¡Gracias por tu compra!";
  $("#sub").innerHTML = "Tu pago se aprobó. Esta es tu <b>licencia</b> — guardala y usala en la app con el <b>mismo email</b> con el que pagaste.";
  const email = d.email ? `<p class="email-note">Licencia a nombre de <b>${escaparHtml(d.email)}</b>. Ingresá ese email al activar.</p>` : "";
  $("#contenido").innerHTML = `
    <div class="lic-box">
      <div class="lic-label">Tu clave de licencia</div>
      <div class="lic-key" id="lk">${d.licencia}</div>
      <button class="copiar" id="btnCopiar">Copiar clave</button>
      ${email}
    </div>
    <div class="dl">${botonesDescarga(d)}</div>
    <details class="pasos ayuda-win">
      <summary>En Android dice <b>“no se pueden instalar apps desconocidas”</b>? (es normal)</summary>
      <div class="ayuda-win-cuerpo">
        <p>La app no está en Google Play — se descarga directo de nosotros. Android
        pide un permiso <b>una sola vez</b>:</p>
        1. Tocá el archivo <code>.apk</code> que acabás de bajar.<br>
        2. Cuando avise que la fuente es desconocida, tocá <b>Configuración</b>.<br>
        3. Activá <b>Permitir de esta fuente</b>.<br>
        4. Volvé atrás y tocá <b>Instalar</b>. Listo.<br>
        <p style="margin-top:10px"><b>Si no aparece el aviso:</b><br>
        <b>Android 8+:</b> Ajustes → Aplicaciones → Acceso especial → Instalar apps
        desconocidas → elegí el navegador que usaste → Permitir de esta fuente.<br>
        <b>Android 7 o anterior:</b> Ajustes → Seguridad → Orígenes desconocidos.</p>
        <p>Si Play Protect avisa, tocá <b>Más detalles</b> y después <b>Instalar de
        todos modos</b>: pasa con toda app que no viene de la tienda. El APK está
        firmado por nosotros.</p>
      </div>
    </details>
    <details class="pasos ayuda-win">
      <summary>En Windows aparece <b>“Windows protegió tu PC”</b>? (es normal)</summary>
      <div class="ayuda-win-cuerpo">
        <p>El programa es nuevo y todavía no está firmado con un certificado pago,
        así que Windows muestra un aviso azul la primera vez. <b>No es un virus</b> —
        podés instalarlo sin problema:</p>
        1. En el aviso azul, hacé clic en <b>Más información</b>.<br>
        2. Después apretá <b>Ejecutar de todas formas</b>.<br>
        3. El instalador te deja <b>elegir la carpeta</b> donde instalarlo y seguir normal.<br>
        <p style="margin-top:10px">Si tu empresa bloquea los <code>.exe</code>, usá la
        opción <b>PC sin instalador (.zip)</b> de arriba: se descomprime y se abre con doble clic.</p>
      </div>
    </details>
    <div class="pasos">
      <b>Cómo activarla:</b><br>
      1. Instalá la app (Android) o el programa (PC).<br>
      2. Al abrir, entrá a activar la licencia.<br>
      3. Poné tu email y pegá la clave de arriba. ¡Listo, sin límites!
    </div>
    <details class="garantia-box">
      <summary>7 días de garantía — ¿pedís la devolución?</summary>
      <div class="garantia-cuerpo">
        <p>Confirmá el email con el que pagaste. Si estás dentro de los 7 días, te devolvemos el 100% automáticamente por el mismo medio de pago.</p>
        <input type="email" id="re_email" placeholder="Tu email de pago" autocomplete="email">
        <button type="button" class="btn-reembolso" id="btnReembolso">Confirmar devolución</button>
        <div id="reembolsoMsg" class="reembolso-msg"></div>
      </div>
    </details>
    <div class="resena-box" id="resenaBox">
      <h3>¿Nos dejás una reseña?</h3>
      <p class="sub" style="margin:0 0 10px;font-size:13px">Ayuda a que otros vendedores confíen en el programa. Se publica en la web con tu nombre (o como prefieras firmarla).</p>
      <div class="estrellas" id="estrellas">
        <button type="button" data-v="1">★</button><button type="button" data-v="2">★</button>
        <button type="button" data-v="3">★</button><button type="button" data-v="4">★</button>
        <button type="button" data-v="5">★</button>
      </div>
      <input type="text" id="re_nombre" placeholder="Tu nombre (o iniciales) — cómo firmar la reseña" maxlength="40" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;margin-bottom:10px;font-family:inherit">
      <textarea id="re_comentario" placeholder="Contanos tu experiencia con el programa…" maxlength="600"></textarea>
      <button type="button" class="btn-resena" id="btnResena">Publicar reseña</button>
      <div id="resenaMsg" class="resena-msg"></div>
    </div>`;
  $("#cargando").style.display = "none";
  $("#contenido").style.display = "block";
  const b = $("#btnCopiar");
  if (b) b.addEventListener("click", () => {
    navigator.clipboard.writeText(d.licencia).then(()=>{ b.textContent = "¡Copiada!"; }).catch(()=>{});
  });
  const btnR = $("#btnReembolso");
  if (btnR) btnR.addEventListener("click", () => pedirReembolso(d._pid, d._proc));
  configurarResena(d._pid, d._proc);
}
let puntajeElegido = 0;
function configurarResena(pid, proc){
  const est = $("#estrellas");
  if (!est) return;
  est.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      puntajeElegido = parseInt(btn.dataset.v, 10);
      est.querySelectorAll("button").forEach((b) => b.classList.toggle("on", parseInt(b.dataset.v,10) <= puntajeElegido));
    });
  });
  $("#btnResena").addEventListener("click", () => enviarResena(pid, proc));
}
async function enviarResena(pid, proc){
  const msg = $("#resenaMsg");
  const comentario = ($("#re_comentario").value || "").trim();
  const nombre = ($("#re_nombre").value || "").trim();
  msg.className = "resena-msg";
  if (!puntajeElegido) { msg.classList.add("mal"); msg.textContent = "Elegí un puntaje de 1 a 5 estrellas."; return; }
  if (comentario.length < 8) { msg.classList.add("mal"); msg.textContent = "Contanos un poco más (mínimo 8 caracteres)."; return; }
  const btn = $("#btnResena");
  btn.disabled = true; btn.textContent = "Publicando…";
  try{
    const r = await fetch("/api/resenas", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-mv-app": "mvfba-web-1" },
      body: JSON.stringify({ payment_id: pid, proc: proc || undefined, puntaje: puntajeElegido, comentario, nombre }),
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      msg.classList.add("ok"); msg.textContent = "¡Gracias! Tu reseña ya está publicada.";
      btn.textContent = "Publicada"; $("#re_comentario").disabled = true; $("#re_nombre").disabled = true;
      $("#estrellas").querySelectorAll("button").forEach((b) => b.disabled = true);
    } else {
      btn.disabled = false; btn.textContent = "Publicar reseña";
      msg.classList.add("mal");
      const textos = {
        ya_reseniado: "Ya dejaste una reseña para esta compra — ¡gracias!",
        puntaje_invalido: "Elegí un puntaje de 1 a 5 estrellas.",
        comentario_muy_corto: "Contanos un poco más (mínimo 8 caracteres).",
      };
      msg.textContent = textos[d.error] || "No pudimos publicar la reseña. Reintentá en un minuto.";
    }
  }catch(e){
    btn.disabled = false; btn.textContent = "Publicar reseña";
    msg.classList.add("mal"); msg.textContent = "Problema de conexión. Reintentá.";
  }
}
async function pedirReembolso(paymentId, proc){
  const email = ($("#re_email").value || "").trim();
  const msg = $("#reembolsoMsg");
  const btn = $("#btnReembolso");
  msg.className = "reembolso-msg";
  if (!email.includes("@")) { msg.classList.add("mal"); msg.textContent = "Poné el email con el que pagaste."; return; }
  if (!confirm("¿Confirmás que querés cancelar la compra y pedir la devolución de tu dinero?")) return;
  btn.disabled = true; btn.textContent = "Procesando…";
  try{
    const r = await fetch("/api/reembolso", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-mv-app": "mvfba-web-1" },
      body: JSON.stringify({ payment_id: paymentId, email, proc: proc || undefined }),
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      msg.classList.add("ok");
      msg.textContent = "✔ " + d.mensaje;
      btn.textContent = "Devolución procesada";
    } else {
      btn.disabled = false; btn.textContent = "Confirmar devolución";
      msg.classList.add("mal");
      const textos = {
        email_no_coincide: "Ese email no coincide con el del pago. Revisalo o escribinos a vieraschiavi@gmail.com.",
        fuera_de_plazo: "Ya pasaron más de 7 días desde la compra. Escribinos a vieraschiavi@gmail.com para revisar tu caso.",
        ya_reembolsado: "Este pago ya fue reembolsado.",
        no_aprobado: "Este pago no figura como aprobado.",
      };
      msg.textContent = textos[d.error] || "No pudimos procesar la devolución automática. Escribinos a vieraschiavi@gmail.com y te ayudamos a mano.";
    }
  }catch(e){
    btn.disabled = false; btn.textContent = "Confirmar devolución";
    msg.classList.add("mal");
    msg.textContent = "Hubo un problema de conexión. Reintentá o escribinos a vieraschiavi@gmail.com.";
  }
}
function mostrarPendiente(estado){
  $("#titulo").textContent = "Pago en proceso";
  $("#sub").textContent = "Tu pago todavía se está procesando (estado: " + (estado||"pendiente") + "). Apenas se acredite te llega la licencia; podés volver a esta página o escribirnos.";
  $("#cargando").style.display = "none";
}
function mostrarError(msg){
  $("#titulo").textContent = "No pudimos confirmar el pago";
  $("#sub").textContent = "";
  $("#cargando").style.display = "none";
  $("#contenido").style.display = "block";
  $("#contenido").innerHTML = `<div class="err">${msg}</div>`;
}

(async () => {
  const p = params();
  const pid = p.payment_id || p.collection_id;
  const proc = p.proc || "";
  if (!pid){
    mostrarError("No recibimos el identificador del pago. Si ya pagaste y ves esto, escribinos a vieraschiavi@gmail.com y te enviamos la licencia.");
    return;
  }
  try{
    const q = "payment_id=" + encodeURIComponent(pid) + (proc ? "&proc=" + encodeURIComponent(proc) : "");
    const r = await fetch("/api/licencia?" + q, {
      headers: { "x-mv-app": "mvfba-web-1" },
    });
    if (r.status === 503){ mostrarError("El cobro todavía no está activado. Escribinos y lo resolvemos."); return; }
    const d = await r.json();
    if (d.aprobado) { d._pid = pid; d._proc = proc; mostrarAprobado(d); }
    else if (d.estado) mostrarPendiente(d.estado);
    else mostrarError("No pudimos verificar el pago. Escribinos a vieraschiavi@gmail.com con tu comprobante y te ayudamos.");
  }catch(e){
    mostrarError("Hubo un problema al verificar el pago. Reintentá en un minuto o escribinos.");
  }
})();
</script>
</body>
</html>
